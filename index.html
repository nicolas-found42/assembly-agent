<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASM::AGENT — chat with web search</title>
  <meta name="description"
    content="ASM::AGENT is a chat assistant. It searches the web, then answers with sources. Free models run without a key.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>

<body>
  <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="b-shell" id="b-shell">
    <div class="b-crt" aria-hidden="true"><span class="b-scan"></span><span class="b-vig"></span></div>

    <header class="b-header">
      <span class="b-brand">ASM<span aria-hidden="true">::</span>AGENT</span>
      <nav class="b-acts" aria-label="App">
        <button type="button" class="b-act" id="b-new">New chat</button>
        <button type="button" class="b-act" id="b-chats">Chats</button>
        <button type="button" class="b-act" id="b-assist">Assistant</button>
        <button type="button" class="b-act" id="b-model">Model</button>
        <button type="button" class="b-act" id="b-settings">Settings</button>
      </nav>
    </header>

    <main class="b-transcript" id="b-transcript" role="log" aria-live="off" aria-atomic="false"
      aria-label="Chat history" tabindex="0"></main>

    <div class="b-dock">
      <form class="b-composer" id="b-composer" autocomplete="off">
        <textarea id="b-input" class="b-textarea" rows="1" placeholder="Ask a question" aria-label="Message"
          spellcheck="false"></textarea>
        <button class="b-send" id="b-send" type="button" aria-label="Send message">Send</button>
      </form>
      <div class="b-status" id="b-status" role="group" aria-label="Status">
        <span class="b-strip-item b-strip-prog" id="b-st-progress">Ready</span>
        <span class="b-strip-gap" aria-hidden="true"></span>
        <span class="b-strip-item" id="b-st-assistant" title="Assistant">ASM::AGENT</span>
        <span class="b-strip-item" id="b-st-model" title="Model">no model</span>
        <span class="b-strip-item" id="b-st-key" title="API key">No API key</span>
      </div>
    </div>
  </div>

  <script type="module">
    // bare import() failures are invisible on GH Pages — print them
    import('./js/main.js').catch((e) => {
      document.body.insertAdjacentHTML('beforeend',
        `<pre style="color:#ffb000;background:#0b0600;padding:16px;white-space:pre-wrap">MAIN FAILED — ${e}</pre>`);
    });
  </script>
</body>

</html>
