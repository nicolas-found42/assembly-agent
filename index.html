<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASM::AGENT</title>
  <meta name="description"
    content="Amber phosphor CRT terminal agent — hand-written WAT engine, OpenRouter LLM, fan-out web search.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>

<body>
  <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="b-shell" id="b-shell">
    <div class="b-crt" aria-hidden="true"><span class="b-scan"></span><span class="b-vig"></span></div>
    <main class="b-transcript" id="b-transcript" role="log" aria-live="off" aria-atomic="false"
      aria-label="Terminal transcript" tabindex="0"></main>
    <div class="b-dock">
      <ul class="b-sug" id="b-sug" aria-label="Command suggestions" hidden></ul>
      <form class="b-prompt" id="b-prompt" autocomplete="off">
        <span class="b-ps1" id="b-ps1" aria-hidden="true">guest@asm:~$</span>
        <span class="b-field">
          <span class="b-mirror" id="b-mirror" aria-hidden="true"></span><span class="b-caret" id="b-caret"
            aria-hidden="true">█</span>
          <span class="b-ph" id="b-ph" aria-hidden="true"></span>
          <textarea id="b-input" class="b-ghost" rows="1" spellcheck="false" autocapitalize="off" autocorrect="off"
            aria-label="Message, or a colon command" tabindex="0"></textarea>
        </span>
        <button class="b-send" id="b-send" type="button" aria-label="Send message">↵</button>
      </form>
      <div class="b-status" id="b-status" aria-label="Status line">
        <span class="b-seg b-brand">ASM<span aria-hidden="true">::</span>AGENT</span>
        <button type="button" class="b-seg" data-cmd="session" title=":session — list and switch sessions"><span
            id="b-st-session">[s1/1]</span></button>
        <button type="button" class="b-seg" data-cmd="model" title=":model — choose the active model"><span
            class="b-seg-k">MODEL:</span><span class="b-seg-v" id="b-st-model">—</span></button>
        <button type="button" class="b-seg" data-cmd="preset" title=":preset — system prompt preset"><span
            class="b-seg-k">PRESET:</span><span class="b-seg-v" id="b-st-preset">—</span></button>
        <span class="b-spacer"></span>
        <button type="button" class="b-seg" data-cmd="key" title=":key — OpenRouter API key and data"><span
            class="b-seg-k">KEY</span></button>
        <button type="button" class="b-seg" data-cmd="mem" title=":mem — print memory regions"><span
            class="b-seg-k">MEM</span><span class="b-seg-v" id="b-st-mem">0KB</span></button>
        <span class="b-seg b-lo"><span class="b-seg-k">MSG</span><span class="b-seg-v" id="b-st-msg">0</span></span>
        <span class="b-seg b-lo"><span class="b-seg-k">TOK/S</span><span class="b-seg-v" id="b-st-tps">0.0</span></span>
        <span class="b-seg b-state"><span class="b-seg-k">STATE</span><span class="b-seg-v"
            id="b-st-state">BOOT</span></span>
      </div>
    </div>
  </div>

  <script type="module">
    // bare import() failures are invisible on GH Pages — print them
    import('./js/main.js').catch((e) => {
      document.body.insertAdjacentHTML('beforeend',
        `<pre style="color:#ffb000;background:#0b0600;padding:16px;white-space:pre-wrap">MAIN FAILED — ${e}</pre>`);
    });
  </script>
</body>

</html>
