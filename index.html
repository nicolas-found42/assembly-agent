<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASM::AGENT</title>
  <meta name="description" content="Amber phosphor CRT chat agent — hand-written WAT engine, OpenRouter LLM, fan-out web search.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="crt-overlay" aria-hidden="true">
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div id="boot-overlay">
    <pre id="boot-lines" aria-hidden="true"></pre>
  </div>

  <header id="hud">
    <span class="brand">ASM<span class="brand-dim">::</span>AGENT</span>
    <span id="telemetry" class="telemetry">MEM 0KB · MSG 0 · TOK/S 0.0 · STATE IDLE</span>
    <span class="hud-btns">
      <button id="btn-scan" class="hud-btn on" title="scanlines">SCAN</button>
      <button id="btn-curve" class="hud-btn on" title="curvature">CURVE</button>
      <button id="btn-flicker" class="hud-btn" title="flicker">FLICKER</button>
      <button id="btn-sound" class="hud-btn" title="sound">SND</button>
      <button id="btn-inspector" class="hud-btn" title="inspector">ASM</button>
      <button id="btn-settings" class="hud-btn" title="settings">SET</button>
    </span>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <button id="btn-new-chat" class="side-btn primary">+ NEW CHAT</button>
      <div id="session-list"></div>
      <div class="sysprompt-drawer">
        <button id="btn-sysprompt" class="side-btn">SYSTEM PROMPT ▸</button>
        <div id="sysprompt-panel" hidden>
          <div id="preset-btns"></div>
          <textarea id="sysprompt-text" rows="6" spellcheck="false"></textarea>
          <button id="btn-sysprompt-save" class="side-btn primary">APPLY</button>
        </div>
      </div>
    </aside>

    <main id="chat">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="input" rows="1" placeholder="TYPE YOUR QUERY — ENTER TO TRANSMIT" spellcheck="false"></textarea>
        <div class="composer-row">
          <button id="btn-model" class="side-btn" title="model catalog">MODEL: …</button>
          <span id="model-hint" class="telemetry"></span>
          <button id="btn-send" class="side-btn primary">SEND</button>
          <button id="btn-stop" class="side-btn stop" hidden>STOP</button>
        </div>
      </div>
    </main>

    <aside id="inspector" hidden>
      <div class="insp-tabs">
        <button class="insp-tab on" data-tab="source">SOURCE</button>
        <button class="insp-tab" data-tab="memory">MEMORY</button>
        <button id="btn-insp-close" class="icon-btn">✕</button>
      </div>
      <div id="insp-source" class="insp-body"><pre id="wat-listing"></pre></div>
      <div id="insp-memory" class="insp-body" hidden></div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
