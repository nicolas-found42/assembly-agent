name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y wabt
      - run: ./build.sh
      - name: Test (node-safe suites)
        run: node --test test/sources.test.mjs test/guard.test.mjs test/tool-loop.mjs
